<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1b3d">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Iron Week — 6 Day Workout Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f9;--card:#fff;--ink:#0f1b3d;--muted:#5d6b87;--line:#dfe5f0;--blue:#2a4fff;--lime:#d6f43c;--blue-soft:#e8edff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;line-height:1.5}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--ink);color:#fff;padding:32px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:'Outfit',sans-serif;font-weight:800;font-size:30px;line-height:1;margin:0 8px 6px}
.brand b{color:var(--lime)}
.sub{color:#9aa8cc;font-size:13px;margin:0 8px 28px}
.days{display:flex;flex-direction:column;gap:6px}
.day{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:transparent;border:0;color:#c5cfe8;padding:12px;border-radius:12px;cursor:pointer;font:500 15px 'Figtree',sans-serif}
.day i{font:800 14px 'Outfit',sans-serif;font-style:normal;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.day small{display:block;color:#8392b8;font-size:12px}
.day:hover{background:rgba(255,255,255,.06)}
.day.on{background:var(--lime);color:var(--ink)}
.day.on i{background:var(--ink);color:var(--lime)}
.day.on small{color:#3b4a1a}
.day:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
main{padding:40px clamp(18px,4vw,56px) 80px;max-width:920px;width:100%}
.top small{color:var(--blue);font-weight:600}
.top h1{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:4px 0 18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.stat b{font:800 22px 'Outfit',sans-serif;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.prog{background:var(--line);height:8px;border-radius:99px;overflow:hidden;margin-bottom:6px}
.prog div{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s}
.plabel{font-size:13px;color:var(--muted);margin-bottom:32px}
.grp{margin-bottom:34px}
.grp h2{font:800 20px 'Outfit',sans-serif;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.grp h2 em{font:500 13px 'Figtree',sans-serif;font-style:normal;color:var(--muted);background:var(--blue-soft);padding:2px 10px;border-radius:99px}
.row{display:grid;grid-template-columns:130px 1fr 44px;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.row.done{opacity:.55}
.row.done .name{text-decoration:line-through}
.thumb{width:130px;height:100px;border-radius:10px;overflow:hidden;background:var(--blue-soft);display:grid;place-items:center;color:#8a9ac8;font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.name{font:600 17px 'Outfit',sans-serif;margin-bottom:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tags span:first-child{background:var(--blue);color:#fff}
.tip{font-size:13px;color:var(--muted);margin-top:8px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:16px;justify-self:center}
.chk:hover{border-color:var(--blue)}
.chk:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row.done .chk{background:var(--blue);border-color:var(--blue);color:#fff}
.today{font:700 10px "Figtree",sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.5px;background:var(--lime);color:var(--ink);padding:2px 7px;border-radius:99px;margin-left:8px;vertical-align:middle}
.day.on .today{background:var(--ink);color:var(--lime)}
.rest{background:var(--blue-soft);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:22px;font-weight:500}
.notes{background:var(--lime);border-radius:16px;padding:20px 24px}
.notes h3{font:800 17px 'Outfit',sans-serif;margin-bottom:6px}
.notes li{margin-left:18px;font-size:14px;padding:2px 0}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;padding:20px 16px 14px}
 .sub{margin-bottom:14px}
 .days{flex-direction:row;overflow-x:auto;gap:8px}
 .days::-webkit-scrollbar{display:none}
 .day{width:auto;flex:none;padding:8px 14px 8px 8px}
 .day small{display:none}
}
@media(max-width:520px){
 .row{grid-template-columns:96px 1fr 38px;gap:12px}
 .thumb{width:96px;height:84px}
 .tip{display:none}
}
</style>
</head>
<body>
<div class="app">
 <aside>
  <div class="brand">IRON<b>WEEK</b></div>
  <p class="sub">6-day body-part split for strength and muscle</p>
  <nav class="days" id="nav" aria-label="Workout days"></nav>
 </aside>
 <main id="main"></main>
</div>
<script>
// Images: put your folder or web address here (must end with "/"). "./" = same folder as this file.
const IMAGE_BASE="./";
// [name, sets, reps, rest, tip, image file]
const DAYS=[
{t:"Chest & triceps",k:"Push day",g:[
 ["Chest",[
  ["Flat barbell bench press","4","8","90s","Drive through chest, not shoulders. Full range of motion.","chest-bench-press.jpg"],
  ["Incline dumbbell press","3","10","75s","Targets upper chest. Keep elbows at 45° angle.","incline-dumbbell-press.webp"],
  ["Cable flyes / pec deck","3","12","60s","Squeeze at peak. Great for inner chest definition.","fliegende-kabelzug.webp"],
  ["Push-ups (finisher)","2","Failure","60s","Burn out finisher. Stop only when form breaks down.","liegestuetze.webp"]]],
 ["Triceps",[
  ["Close grip bench press","4","8","90s","Elbows tucked in. Hits both chest and triceps.","ez-bar-close-grip-bench-press.webp"],
  ["Skull crushers","3","10","75s","EZ-bar preferred. Lower slowly to forehead, explode up.","DB-Skull-Crushers.png"],
  ["Rope pushdown","3","15","60s","Spread rope at bottom. Lock elbows to sides.","Rope-Pushdown.gif"],
  ["Overhead dumbbell extension","3","12","60s","Hits the long head. Keep elbows pointing forward.","images.jpg"]]]],
 n:["Do chest first while you're fresh, triceps after.","Superset rope pushdowns with overhead extensions for a brutal finisher.","Rest 90s for compounds, 60s for isolation.","Close grip bench doubles as chest + triceps, which is very efficient."]},
{t:"Back, biceps & forearms",k:"Pull day",g:[
 ["Back / wings",[
  ["Pull-ups / lat pulldown","4","10","90s","King of lat exercises. Full range, slow on the way down.","Lat_Pulldown.png"],
  ["Bent-over barbell row","4","8","90s","Hinge at hips, back flat. Pull bar to lower chest.","3-2a-barbell-bent-over-row.jpg"],
  ["Seated cable row","4","10","75s","Squeeze shoulder blades at peak. Keep chest up.","SeatedCableRow.jpg"],
  ["Single-arm dumbbell row","3","12","60s","Full stretch at bottom. Drive elbow to hip, not ceiling.","rudern-kurzhantel-800x448.webp"],
  ["Straight-arm pushdown","3","12","60s","Arms nearly straight. Feel the lats working.","02381201.avif"]]],
 ["Biceps & forearms",[
  ["Barbell curl","3","10","75s","No swinging. Keep elbows pinned.",null],
  ["Incline dumbbell curl","3","12","60s","Deep stretch at the bottom of each rep.",null],
  ["Hammer curl","3","12","60s","Neutral grip builds the brachialis and forearms.",null],
  ["Wrist curl","3","15","45s","Slow and controlled for forearm size.",null]]]],
 n:["Lead every pull with your elbows, not your hands.","Do biceps after back. They're already warm from the rows."]},
{t:"Legs",k:"Lower body",g:[
 ["Quads & glutes",[
  ["Barbell back squat","4","8","120s","Brace your core. Hit at least parallel depth.",null],
  ["Leg press","3","12","90s","Feet shoulder-width. Don't lock out the knees.",null],
  ["Walking lunges","3","12 / leg","75s","Long stride, torso upright.",null],
  ["Leg extension","3","15","60s","Pause for one second at the top.",null]]],
 ["Hamstrings & calves",[
  ["Romanian deadlift","4","10","90s","Push hips back, bar close to the legs.",null],
  ["Lying leg curl","3","12","60s","Control the lowering phase.",null],
  ["Standing calf raise","4","15","45s","Full stretch, hard squeeze at the top.",null]]]],
 n:["Warm up with a few light squat sets before going heavy.","Give legs 48 hours before training them again."]},
{t:"Shoulders & traps",k:"Push day",g:[
 ["Shoulders",[
  ["Overhead barbell press","4","8","90s","Squeeze glutes and keep ribs down. Press in a straight line.",null],
  ["Dumbbell lateral raise","4","15","45s","Lead with the elbows, stop at shoulder height.",null],
  ["Seated dumbbell press","3","10","75s","Slight incline on the bench is fine.",null],
  ["Rear delt fly","3","15","45s","Light weight, squeeze the upper back.",null]]],
 ["Traps",[
  ["Barbell shrug","4","12","60s","Straight up and down. Don't roll the shoulders.",null],
  ["Face pull","3","15","45s","Pull to forehead height. Great for shoulder health.",null]]]],
 n:["Chest was trained on Day 1, so today is pure shoulders. Keep the pressing moderate.","Rear delts and face pulls keep shoulders healthy long term."]},
{t:"Arms",k:"Arm day",g:[
 ["Biceps",[
  ["EZ-bar curl","4","10","75s","Controlled lowering, no body swing.",null],
  ["Preacher curl","3","12","60s","Don't hyperextend at the bottom.",null],
  ["Cable curl","3","15","45s","Constant tension throughout.",null]]],
 ["Triceps",[
  ["Dips","3","10","75s","Lean slightly forward and keep elbows close.",null],
  ["Cable overhead extension","3","12","60s","Elbows high, stretch fully.",null],
  ["Triceps kickback","3","15","45s","Squeeze hard at lockout.",null]]]],
 n:["Alternate biceps and triceps sets to save time.","Arms are small muscles. Don't rest more than 60s."]},
{t:"Abs & core",k:"Core and conditioning",g:[
 ["Abs",[
  ["Hanging leg raise","4","12","60s","Curl the pelvis up, don't just swing the legs.",null],
  ["Cable crunch","4","15","45s","Round the spine and bring ribs to hips.",null],
  ["Russian twist","3","20","45s","Rotate from the torso, feet off the floor if you can.",null],
  ["Plank","3","60s hold","45s","Straight line from head to heels.",null]]],
 ["Conditioning",[
  ["Incline walk or bike","1","20 min","-","Easy pace. Helps recovery before the next week.",null]]]],
 n:["Abs recover quickly, so you can add a short core finisher to other days if you like.","Use this day as your lighter session to recover."]}
];

const wd=new Date().getDay();            // 0 = Sunday, 1 = Monday ... 6 = Saturday
const todayIdx=wd===0?-1:wd-1;             // Monday -> Day 1 ... Saturday -> Day 6
const nav=document.getElementById('nav'),main=document.getElementById('main');
let cur=0,done={};
try{done=JSON.parse(localStorage.getItem('ironweek')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ironweek',JSON.stringify(done))}catch(e){}};
const key=(d,g,i)=>`${d}-${g}-${i}`;
function row(e,k){
 const [n,s,r,rest,tip,img]=e;
 const th=img?`<img src="${IMAGE_BASE}${img}" alt="${n}" loading="lazy" onerror="this.remove()">Add image`:'Add image';
 const media=img?`<img src="${IMAGE_BASE}${img}" alt="${n}" loading="lazy" onerror="this.style.display='none'"><span style="position:absolute;z-index:0">Add image</span>`:'Add image';
 return `<div class="row${done[k]?' done':''}" data-k="${k}"><div class="thumb" style="position:relative">${media}</div><div><div class="name">${n}</div><div class="tags"><span>${s} sets</span><span>${r}${/^\d+$/.test(r)?' reps':''}</span>${rest!=='-'?`<span>${rest} rest</span>`:''}</div><p class="tip">${tip}</p></div><button class="chk" aria-label="Mark ${n} done" onclick="tog('${k}')">&#10003;</button></div>`;
}
function progress(){
 const d=DAYS[cur];let t=0,c=0;
 d.g.forEach(([g,ex],gi)=>ex.forEach((e,i)=>{t++;if(done[key(cur,gi,i)])c++}));
 document.getElementById('bar').style.width=(t?c/t*100:0)+'%';
 document.getElementById('pl').textContent=`${c} of ${t} exercises done`;
}
function tog(k){done[k]=!done[k];save();const el=document.querySelector(`[data-k="${k}"]`);el.classList.toggle('done',!!done[k]);progress()}
function show(i,rest){
 cur=i;const d=DAYS[i];
 [...nav.children].forEach((b,j)=>b.classList.toggle('on',j===i));
 let ex=0,sets=0;d.g.forEach(([g,l])=>l.forEach(e=>{ex++;sets+=parseInt(e[1])||0}));
 main.innerHTML=(rest?`<div class="rest">Sunday is your rest day. Here is Monday's workout to get ready.</div>`:'')+`<div class="top"><small>${i===todayIdx?'Today · ':''}Day ${i+1} · ${d.k}</small><h1>${d.t}</h1></div>
 <div class="stats"><div class="stat"><b>${ex}</b><span>exercises</span></div><div class="stat"><b>${sets}</b><span>total sets</span></div><div class="stat"><b>~${Math.round(sets*2.5)}</b><span>minutes</span></div></div>
 <div class="prog"><div id="bar"></div></div><p class="plabel" id="pl"></p>`+
 d.g.map(([g,l],gi)=>`<section class="grp"><h2>${g}<em>${l.length} exercises</em></h2>${l.map((e,ei)=>row(e,key(i,gi,ei))).join('')}</section>`).join('')+
 (d.n.length?`<div class="notes"><h3>Notes</h3><ul>${d.n.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'');
 progress();window.scrollTo({top:0,behavior:'smooth'});
}
DAYS.forEach((d,i)=>{const b=document.createElement('button');b.className='day';b.innerHTML=`<i>${i+1}</i><span>${d.t}${i===todayIdx?'<em class="today">Today</em>':''}<small>${d.k}</small></span>`;b.onclick=()=>show(i);nav.appendChild(b)});
show(todayIdx<0?0:todayIdx,todayIdx<0);
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
